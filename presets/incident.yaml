# CHARGEHAND-192: diagnoses an alert from the logs, metrics and traces the profile's read-only MCP servers give the worker, and from the
# code at the pinned commit. It lists no services: a shipped preset cannot name anyone's servers, so the profile maps them
# (preset_services.incident, docs/guide/memory-and-services.md). Read-only like every preset (ADR 0006).
schema: preset/v1
name: incident
version: 0.1.0
allowed_actions: [answer]
node_kinds:
  worker:
    model: provider/worker-model
    opencode_agent: build
    permissions:
      - { action: "*", resource: "*", effect: allow }
      - { action: edit, resource: "*", effect: deny }
      - { action: read, resource: "*.env", effect: deny }
      - { action: read, resource: "*.env.*", effect: deny }
      - { action: read, resource: "*.env.example", effect: allow }
      - { action: read, resource: "*.env.enc", effect: allow }   # SOPS ciphertext: GitOps repos track it
      - { action: read, resource: "*.env.test.*", effect: allow }   # test sources named after what they test (options.env.test.js) are code
      - { action: read, resource: "*.env.spec.*", effect: allow }
      - { action: read, resource: "*.env.*.local", effect: deny }   # .env.test.local and the like hold real values
      - { action: shell, resource: "*", effect: deny }
      - { action: webfetch, resource: "*", effect: deny }
      - { action: external_directory, resource: "*", effect: deny }
      - { action: question, resource: "*", effect: deny }
      - { action: subagent, resource: "*", effect: deny }
    budget: { max_input_tokens: 400000, max_usd: 1.00 }
    compaction: { auto: true, keep_tokens: 15000, buffer: 120000 }
critic: { enabled: false }
approval: {}
