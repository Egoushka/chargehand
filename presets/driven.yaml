# driven (ADR 0039): the limits of a driven writing session, one container per task. The session is headless Claude Code running the
# change skill inside a container; what it may do is set by the container and the driver's tool list, not by this file. The node kind
# below is read-only on purpose: the skill's nested research and review calls, and any request that names this preset without a
# `driven` block, get no edit and no shell. Last matching permission rule wins.
schema: preset/v1
name: driven
version: 0.1.0
allowed_actions: [answer, ask, deny]
node_kinds:
  session:
    model: provider/worker-model
    opencode_agent: build
    permissions:
      - { action: "*", resource: "*", effect: allow }
      - { action: edit, resource: "*", effect: deny }
      - { action: shell, resource: "*", effect: deny }
      - { action: webfetch, resource: "*", effect: deny }
      - { action: external_directory, resource: "*", effect: deny }
      - { action: subagent, resource: "*", effect: deny }
      - { action: read, resource: "*.env", effect: deny }
      - { action: read, resource: "*.env.*", effect: deny }
      - { action: read, resource: "*.env.example", effect: allow }
      - { action: question, resource: "*", effect: deny }
    budget: { max_input_tokens: 2000000, max_usd: 3.00 }
driven:
  max_minutes: 45
  no_progress_minutes: 10
  max_turns: 80
  max_tokens: 2000000
  memory_mb: 4096
  cpus: 2
  pids: 512
  allow: [api.anthropic.com, registry.npmjs.org, api.nuget.org, pypi.org, files.pythonhosted.org]
critic: { enabled: false }
approval: {}
