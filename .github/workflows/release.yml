name: release

# A tag v<Version> publishes the release (ADR 0024, decision D8): the GitHub Release with the version's CHANGELOG.md
# section, the server image ghcr.io/<owner>/chargehand:<Version>, and on nuget.org the dnx tool Chargehand (ADR 0027) and
# Chargehand.Contracts, each when its version is new there, when the repository variable NUGET_USER names the nuget.org
# account whose trusted-publishing policy trusts this workflow. The release environment waits for the owner's approval. A tag without a changelog section fails first.
# When NUGET_USER is set, the mcp-registry job then lists the version in the MCP Registry (ADR 0027).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against Directory.Build.props and the changelog
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Version $version" >&2
            exit 1
          fi
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_ENV"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE" .
      - run: docker push "$IMAGE"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: vars.NUGET_USER != ''
        with:
          global-json-file: global.json
      - name: Pack what is new on nuget.org
        id: pack
        if: vars.NUGET_USER != ''
        run: |
          on_nuget() { # <package id> <version>
            id=$(printf '%s' "$1" | tr 'A-Z' 'a-z'); v=$(printf '%s' "$2" | tr 'A-Z' 'a-z')
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$id/$v/$id.$v.nupkg")" = 200 ]
          }
          contracts=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Chargehand.Contracts/Chargehand.Contracts.csproj)
          if on_nuget Chargehand.Contracts "$contracts"; then
            echo "Chargehand.Contracts $contracts is already on nuget.org"
          else
            dotnet pack src/Chargehand.Contracts -c Release -o "$RUNNER_TEMP/nupkg"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          if on_nuget Chargehand "$VERSION"; then
            echo "Chargehand $VERSION is already on nuget.org"
          else
            dotnet pack src/Chargehand.Cli -c Release -o "$RUNNER_TEMP/nupkg"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        if: steps.pack.outputs.new == 'true'
        with:
          user: ${{ vars.NUGET_USER }}
      - if: steps.pack.outputs.new == 'true'
        run: dotnet nuget push "$RUNNER_TEMP"/nupkg/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  # ADR 0027: list the version in the MCP Registry once nuget.org serves its package. A job of its own, so that it holds
  # no write token, a registry outage (the registry is in preview) leaves the image, the packages and the GitHub Release
  # as they are, and "Re-run failed jobs" repeats this job alone. The registry's OIDC login covers every server under
  # io.github.<owner>/*; needs keeps that behind the release job and so behind its environment's approval.
  mcp-registry:
    needs: release
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp .mcp/server.json with the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Version $version" >&2
            exit 1
          fi
          jq --arg v "$version" '.version = $v | .packages[].version = $v' .mcp/server.json > "$RUNNER_TEMP/server.json"
          jq -e --arg v "$version" '.version == $v and all(.packages[]; .version == $v)' "$RUNNER_TEMP/server.json" > /dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install mcp-publisher
        env:
          # The registry answers "invalid audience" to a publisher older than v1.7.6. To bump: the version from the
          # registry's release page, and the digest of mcp-publisher_linux_amd64.tar.gz from that release's checksums file.
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/bin" mcp-publisher
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The registry reads the package README from nuget.org's flat container and looks for the ownership line; the
      # push above can precede that by minutes. Wait for the same URL, for at most 20 minutes.
      - name: Wait for the package README on nuget.org
        run: |
          name=$(jq -r .name "$RUNNER_TEMP/server.json")
          id=$(jq -r '.packages[] | select(.registryType == "nuget") | .identifier | ascii_downcase' "$RUNNER_TEMP/server.json")
          lower=$(printf '%s' "${VERSION%%+*}" | tr 'A-Z' 'a-z')
          url="https://api.nuget.org/v3-flatcontainer/$id/$lower/readme"
          for attempt in $(seq 1 40); do
            readme=$(curl -fsS "$url" 2>/dev/null || true)
            case "$readme" in
              *"mcp-name: $name"*) echo "$id $VERSION serves a README with the ownership line for $name"; exit 0 ;;
            esac
            echo "attempt $attempt: $url does not serve the ownership line yet"
            sleep 30
          done
          echo "nuget.org did not serve the ownership line for $name within 20 minutes; re-run this job once it does" >&2
          exit 1
      # A version is published once: the registry refuses a second publish of it, so a re-run first asks whether it is listed.
      - name: Publish to the MCP Registry
        run: |
          name=$(jq -r .name "$RUNNER_TEMP/server.json")
          encoded=$(jq -rn --arg n "$name" '$n | @uri')
          listed() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions/$VERSION")" = 200 ]
          }
          if listed; then
            echo "$name $VERSION is already in the MCP Registry"
            exit 0
          fi
          mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            if mcp-publisher publish "$RUNNER_TEMP/server.json"; then
              exit 0
            fi
            if listed; then
              exit 0
            fi
            echo "attempt $attempt failed" >&2
            sleep 30
          done
          exit 1
