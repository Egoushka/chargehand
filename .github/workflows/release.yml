name: release

# A GitHub Release vX.Y.Z, created by release-please when its pull request merges (release-please.yml), publishes the
# release (ADR 0024, decision D8): the server image ghcr.io/<owner>/chargehand:<Version>, the session image of driven sessions
# ghcr.io/<owner>/chargehand-session:<Version> (ADR 0039) with its JDK variant ghcr.io/<owner>/chargehand-session-jdk:<Version> (ADR 0048), both for linux/amd64 and linux/arm64 (ADR 0058:
# the release job pushes amd64, the session-arm64 job builds arm64 on an arm64 runner and turns each tag into an index of the two), and on nuget.org the dnx tool Chargehand (ADR 0027) and
# Chargehand.Contracts, each when its version is new there, when the repository variable NUGET_USER names the nuget.org
# account whose trusted-publishing policy trusts this workflow. The release waits for the owner's approval only when its pull request carries the label needs-approval (environment release); otherwise it runs in release-auto. A release without a changelog section fails first.
# When NUGET_USER is set, the mcp-registry job then lists the version in the MCP Registry (ADR 0027). The pin job then asks
# Renovate to open the homelab-gitops pin pull request.
on:
  release:
    types: [published]

# One release can start two runs (a tag push arrived twice for v0.3.0 and v0.4.1): the later cancels the earlier one waiting at the environment gate.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The owner asks for an approval by labelling the release pull request needs-approval; without it the release runs
  # in release-auto, which has no reviewers. A release with no pull request (made by hand) also runs unapproved; one whose
  # labels cannot be read waits for the approval.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[].labels[].name] | join(",")' 2>/dev/null) || { labels=needs-approval; echo "::warning::could not read the release pull request's labels; asking for the approval"; }
          case ",$labels," in
            *,needs-approval,*) environment=release ;;
            *) environment=release-auto ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: environment $environment (labels: ${labels:-none})" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ needs.gate.outputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.digests.outputs.version }}
      session_amd64: ${{ steps.digests.outputs.session }}
      session_jdk_amd64: ${{ steps.digests.outputs.session_jdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against Directory.Build.props and the changelog
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Version $version" >&2
            exit 1
          fi
          scripts/release-notes.sh "$version" > /dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_ENV"
          echo "SESSION_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-session:$version" >> "$GITHUB_ENV"
          echo "SESSION_JDK_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-session-jdk:$version" >> "$GITHUB_ENV"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE" .
      - run: docker push "$IMAGE"
      # The session image is built from the same checkout, so its driver and plugin match the server's version. A deployment pins both by digest (printed below).
      - run: docker build -f images/session/Dockerfile --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$SESSION_IMAGE" .
      - run: docker push "$SESSION_IMAGE"
      # The variant with a JDK and Gradle for Gradle and Maven repositories (ADR 0048) is built on the session image just pushed, named by digest, so the two always match.
      - run: docker build -f images/session-jdk/Dockerfile --build-arg "BASE=$(docker inspect --format '{{index .RepoDigests 0}}' "$SESSION_IMAGE")" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$SESSION_JDK_IMAGE" .
      - run: docker push "$SESSION_JDK_IMAGE"
      # The session images are linux/amd64 here; the session-arm64 job moves their tags to indexes of both platforms and prints the digests to pin.
      - name: Digests to pin
        id: digests
        run: |
          {
            echo "### Images (linux/amd64; the session images become multi-platform in the session-arm64 job)"
            for image in "$IMAGE" "$SESSION_IMAGE" "$SESSION_JDK_IMAGE"; do echo "- \`$(docker inspect --format '{{index .RepoDigests 0}}' "$image")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "version=$VERSION"
            echo "session=$(docker inspect --format '{{index .RepoDigests 0}}' "$SESSION_IMAGE")"
            echo "session_jdk=$(docker inspect --format '{{index .RepoDigests 0}}' "$SESSION_JDK_IMAGE")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: vars.NUGET_USER != ''
        with:
          global-json-file: global.json
      # The dnx tool embeds the operator console (ADR 0056), so it is built before the pack. The server image builds its own in the Dockerfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: vars.NUGET_USER != ''
        with:
          node-version-file: web/console/.nvmrc
      - name: Build the operator console
        if: vars.NUGET_USER != ''
        working-directory: web/console
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Pack what is new on nuget.org
        id: pack
        if: vars.NUGET_USER != ''
        run: |
          on_nuget() { # <package id> <version>
            id=$(printf '%s' "$1" | tr 'A-Z' 'a-z'); v=$(printf '%s' "$2" | tr 'A-Z' 'a-z')
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$id/$v/$id.$v.nupkg")" = 200 ]
          }
          contracts=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Chargehand.Contracts/Chargehand.Contracts.csproj)
          if on_nuget Chargehand.Contracts "$contracts"; then
            echo "Chargehand.Contracts $contracts is already on nuget.org"
          else
            dotnet pack src/Chargehand.Contracts -c Release -o "$RUNNER_TEMP/nupkg"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          if on_nuget Chargehand "$VERSION"; then
            echo "Chargehand $VERSION is already on nuget.org"
          else
            dotnet pack src/Chargehand.Cli -c Release -o "$RUNNER_TEMP/nupkg"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        if: steps.pack.outputs.new == 'true'
        with:
          user: ${{ vars.NUGET_USER }}
      - if: steps.pack.outputs.new == 'true'
        run: dotnet nuget push "$RUNNER_TEMP"/nupkg/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # ADR 0058: the session images for linux/arm64, so a Mac (or any arm64 machine) can be a runner. Built natively on an arm64 runner, not under emulation: the image runs dotnet, node and
  # npm while it builds. A job of its own after the release job, so it sits behind that job's environment approval (needs) without a second one, and an arm64 failure leaves the amd64
  # images, the packages and the GitHub Release as they are ("Re-run failed jobs" repeats this job alone). Each of the two tags becomes an index of the amd64 image from the release job
  # and the arm64 image built here; the JDK image is built on the arm64 session image by digest, as the amd64 one is on its own. The job prints the index digests to pin.
  session-arm64:
    needs: release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SESSION_AMD64: ${{ needs.release.outputs.session_amd64 }}
      SESSION_JDK_AMD64: ${{ needs.release.outputs.session_jdk_amd64 }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Names
        run: |
          echo "SESSION_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-session" >> "$GITHUB_ENV"
          echo "SESSION_JDK_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-session-jdk" >> "$GITHUB_ENV"
      - run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Session image, linux/arm64
        run: |
          docker build -f images/session/Dockerfile --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$SESSION_IMAGE:$VERSION-arm64" .
          docker push "$SESSION_IMAGE:$VERSION-arm64"
          echo "SESSION_ARM64=$(docker inspect --format '{{index .RepoDigests 0}}' "$SESSION_IMAGE:$VERSION-arm64")" >> "$GITHUB_ENV"
      - name: Session index
        run: docker buildx imagetools create -t "$SESSION_IMAGE:$VERSION" "$SESSION_AMD64" "$SESSION_ARM64"
      - name: JDK image, linux/arm64
        run: |
          docker build -f images/session-jdk/Dockerfile --build-arg "BASE=$SESSION_ARM64" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$SESSION_JDK_IMAGE:$VERSION-arm64" .
          docker push "$SESSION_JDK_IMAGE:$VERSION-arm64"
          echo "SESSION_JDK_ARM64=$(docker inspect --format '{{index .RepoDigests 0}}' "$SESSION_JDK_IMAGE:$VERSION-arm64")" >> "$GITHUB_ENV"
      - name: JDK index
        run: docker buildx imagetools create -t "$SESSION_JDK_IMAGE:$VERSION" "$SESSION_JDK_AMD64" "$SESSION_JDK_ARM64"
      - name: Digests to pin
        run: |
          {
            echo "### Session images (linux/amd64 and linux/arm64): pin these"
            for image in "$SESSION_IMAGE:$VERSION" "$SESSION_JDK_IMAGE:$VERSION"; do
              echo "- \`${image%:*}@$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ADR 0027: list the version in the MCP Registry once nuget.org serves its package. A job of its own, so that it holds
  # no write token, a registry outage (the registry is in preview) leaves the image, the packages and the GitHub Release
  # as they are, and "Re-run failed jobs" repeats this job alone. The registry's OIDC login covers every server under
  # io.github.<owner>/*; needs keeps that behind the release job and so behind its environment's approval.
  mcp-registry:
    needs: release
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp .mcp/server.json with the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Version $version" >&2
            exit 1
          fi
          jq --arg v "$version" '.version = $v | .packages[].version = $v' .mcp/server.json > "$RUNNER_TEMP/server.json"
          jq -e --arg v "$version" '.version == $v and all(.packages[]; .version == $v)' "$RUNNER_TEMP/server.json" > /dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install mcp-publisher
        env:
          # The registry answers "invalid audience" to a publisher older than v1.7.6. To bump: the version from the
          # registry's release page, and the digest of mcp-publisher_linux_amd64.tar.gz from that release's checksums file.
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/bin" mcp-publisher
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The registry reads the package README from nuget.org's flat container and looks for the ownership line; the
      # push above can precede that by minutes. Wait for the same URL, for at most 20 minutes.
      - name: Wait for the package README on nuget.org
        run: |
          name=$(jq -r .name "$RUNNER_TEMP/server.json")
          id=$(jq -r '.packages[] | select(.registryType == "nuget") | .identifier | ascii_downcase' "$RUNNER_TEMP/server.json")
          lower=$(printf '%s' "${VERSION%%+*}" | tr 'A-Z' 'a-z')
          url="https://api.nuget.org/v3-flatcontainer/$id/$lower/readme"
          for attempt in $(seq 1 40); do
            readme=$(curl -fsS "$url" 2>/dev/null || true)
            case "$readme" in
              *"mcp-name: $name"*) echo "$id $VERSION serves a README with the ownership line for $name"; exit 0 ;;
            esac
            echo "attempt $attempt: $url does not serve the ownership line yet"
            sleep 30
          done
          echo "nuget.org did not serve the ownership line for $name within 20 minutes; re-run this job once it does" >&2
          exit 1
      # A version is published once: the registry refuses a second publish of it, so a re-run first asks whether it is listed.
      - name: Publish to the MCP Registry
        run: |
          name=$(jq -r .name "$RUNNER_TEMP/server.json")
          encoded=$(jq -rn --arg n "$name" '$n | @uri')
          listed() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions/$VERSION")" = 200 ]
          }
          if listed; then
            echo "$name $VERSION is already in the MCP Registry"
            exit 0
          fi
          mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            if mcp-publisher publish "$RUNNER_TEMP/server.json"; then
              exit 0
            fi
            if listed; then
              exit 0
            fi
            echo "attempt $attempt failed" >&2
            sleep 30
          done
          exit 1

  # Renovate's first-party rule opens the homelab-gitops pin pull request; asking now saves waiting for its nightly run.
  pin:
    needs: [release, session-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.RENOVATE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no RENOVATE_DISPATCH_TOKEN: Renovate pins $GITHUB_REF_NAME on its nightly run"
            exit 0
          fi
          gh workflow run renovate.yml -R Egoushka/engineering-standards -f repository=Egoushka/homelab-gitops
          echo "Renovate asked to pin $GITHUB_REF_NAME in Egoushka/homelab-gitops" >> "$GITHUB_STEP_SUMMARY"
