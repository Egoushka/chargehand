name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ADR 0033: a pull request that touches only prose skips the build jobs. Nothing else reads these files: tests read
  # docs/*.json, and prompts/, presets/, plugins/ and CHANGELOG.md are not in the list. File names come from the API;
  # nothing from the pull request is checked out here.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)')
            other=$(echo "$files" | grep -vE '^(README\.md|ROADMAP\.md|CONTRIBUTING\.md|docs/.*\.md)$' || true)
            if [ -n "$files" ] && [ -z "$other" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags: the schema test compares published schemas with the latest release tag
      # ADR 0056: the console is built first and embedded, so the .NET tests check the files the server serves. Without this step the server still builds and serves a "not built" page.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/console/.nvmrc
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
      - name: The current version has a changelog section
        run: scripts/release-notes.sh "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" > /dev/null

  # ADR 0056: the operator console (web/console) is checked, tested and built apart from dotnet. The smoke test drives the built
  # app in Chromium with the API mocked in the browser, under the same Content-Security-Policy the server sends: no server, no network.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/console/.nvmrc
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: The Dockerfile builds with the Node version in .nvmrc
        working-directory: .
        run: grep -q "^FROM node:$(cat web/console/.nvmrc)-" Dockerfile
      - run: npm ci --ignore-scripts
      - name: Lint and format (biome)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/console/playwright-report/
            web/console/test-results/
          retention-days: 7

  # ADR 0027: the dnx tool packs, carries the Directory.Build.props version in .mcp/server.json, starts from an empty
  # directory and lists orchestrate over stdio. McpServerJsonTests (build job) checks server.json against the schema.
  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet pack src/Chargehand.Cli -c Release -o "$RUNNER_TEMP/package"
      - run: scripts/mcp-smoke.py "$RUNNER_TEMP/package"

  # ADR 0060: every host of the rewrite skeleton (src/Hosts) publishes as a Native AOT binary with no warnings and runs.
  aot:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: scripts/aot-smoke.sh linux-x64

  # Goal 0.5: the Claude Code plugin and its marketplace entry pass the pinned Claude Code validator.
  plugin:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate --strict ./plugins/chargehand
      - run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate --strict .

  # deploy/compose (docs/guide/install.md): the compose file parses in both modes with the example environment.
  compose:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: deploy/compose
        run: |
          cp .env.example .env
          echo CHARGEHAND_API_KEY=ci >> .env
          cp profile.core.json profile.json
          docker compose config -q
          docker compose --profile driven config -q

  secrets:
    runs-on: ubuntu-latest
    # On pull requests gitleaks-action lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      # A squash merge makes the title the commit on main, and release-please reads only main.
      - name: The pull request title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title" && scripts/check-commit-msg.sh "$RUNNER_TEMP/title"

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The one required check (ADR 0033): green when every job above passed or was skipped, so a prose-only pull request
  # merges without the build jobs, and a job renamed or added here needs no change to the ruleset.
  ci-gate:
    if: always()
    needs: [changes, build, web, package, aot, plugin, compose, secrets, commits, dependencies]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
