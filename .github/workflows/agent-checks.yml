# Checks the lines a pull request adds: https://github.com/Egoushka/agent-checks
name: agent-checks
on: pull_request
permissions:
  contents: read
jobs:
  agent-checks:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: Egoushka/agent-checks@v0.1.6
